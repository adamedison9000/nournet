<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOURNET - طلب اشتراك جديد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; direction: rtl; text-align: right; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0070f3; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #0070f3; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #0051cc; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
        .packages-info { background: #eef4ff; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; color: #004085; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>NOURNET</h2>
    <p class="subtitle">اختر الباقة المناسبة لك واطلب اشتراكك بكل سهولة</p>

    <div class="packages-info">
        <b>💡 باقات الإنترنت المتوفرة لدينا:</b>
        <ul style="margin: 5px 0 0 0; padding-right: 20px;">
            <li>جميع السرعات والباقات المتوفرة مع الأسعار المحدثة</li>
        </ul>
    </div>
    
    <form id="telegramForm" onsubmit="sendToTelegram(event)">
        <div class="form-group">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" required placeholder="أدخل اسمك الكريم">
        </div>
        
        <div class="form-group">
            <label for="phone">رقم الهاتف (واتساب):</label>
            <input type="tel" id="phone" required placeholder="03xxxxxx أو 70xxxxxx">
        </div>

        <div class="form-group">
            <label for="location">المنطقة / العنوان (البقاع):</label>
            <input type="text" id="location" required placeholder="اسم المنطقة بالتحديد">
        </div>

        <div class="form-group">
            <label for="package">اختر الباقة المطلوبة:</label>
            <select id="package">
                <optgroup label="الباقات العادية والمشتركة">
                    <option value="Up to 4MB 300GB+FN (25 USD)">Up to 4MB 300GB + FN — 25 USD</option>
                    <option value="Up to 16MB 550GB+FN (30 USD)">Up to 16MB 550GB + FN — 30 USD</option>
                    <option value="Up to 24MB 660GB+FN (35 USD)" selected>Up to 24MB 660GB + FN — 35 USD</option>
                    <option value="Up to 32MB 770GB+FN (40 USD)">Up to 32MB 770GB + FN — 40 USD</option>
                    <option value="Up to 48MB 880GB+FN (45 USD)">Up to 48MB 880GB + FN — 45 USD</option>
                    <option value="Up to 54MB 990GB+FN (50 USD)">Up to 54MB 990GB + FN — 50 USD</option>
                    <option value="Up to 80MB 1.1TB+FN (100 USD)">Up to 80MB 1.1TB + FN — 100 USD</option>
                </optgroup>
                <optgroup label="باقات مخصصة والجيمنج">
                    <option value="Gaming (75 USD)">Gaming — 75 USD</option>
                    <option value="4M-Dedicated (150 USD)">4M-Dedicated — 150 USD</option>
                    <option value="6M-Dedicated (230 USD)">6M-Dedicated — 230 USD</option>
                    <option value="8M-Dedicated (330 USD)">8M-Dedicated — 330 USD</option>
                </optgroup>
            </select>
        </div>

        <button type="submit" id="submitBtn">إرسال طلب الاشتراّك</button>
        <p id="status"></p>
    </form>
</div>

<script>
async function sendToTelegram(event) {
    event.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const location = document.getElementById('location').value;
    const pkg = document.getElementById('package').value;

    submitBtn.disabled = true;
    submitBtn.innerText = "جاري إرسال الطلب...";
    status.style.color = "#555";
    status.innerText = "";

    try {
        const response = await fetch('/api/send-telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, location, package: pkg })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            status.style.color = "green";
            status.innerText = "تم إرسال طلبك بنجاح! سنتواصل معك قريباً.";
            document.getElementById('telegramForm').reset();
        } else {
            status.style.color = "red";
            status.innerText = "حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.";
        }
    } catch (error) {
        status.style.color = "red";
        status.innerText = "تعذر الاتصال بالخادم، تأكد من اتصالك بالإنترنت.";
    }

    submitBtn.disabled = false;
    submitBtn.innerText = "إرسال طلب الاشتراّك";
}
</script>

</body>
</html>
