<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب تركيب خدمة الإنترنت</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 md:p-8">
        <!-- الهيدر -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600 mb-2">طلب تركيب اشتراك إنترنت</h1>
            <p class="text-slate-500 text-sm">يرجى ملء البيانات التالية لتقديم طلب التوصيل وسيتم التواصل معك بأسرع وقت.</p>
        </div>

        <!-- النموذج -->
        <form id="orderForm" class="space-y-4">
            <!-- الاسم الكامل -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">الاسم الكامل *</label>
                <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي" 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- رقم الهاتف -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">رقم الهاتف *</label>
                <input type="tel" id="phone" required placeholder="03XXXXXX" 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- البلدة / العنوان التفصيلي -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">البلدة / المنطقة والحارة *</label>
                <input type="text" id="address" required placeholder="مثال: البقاع - اسم البلدة - الشارع العام" 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- اختيار الباقة -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">اختر الباقة المطلوبة *</label>
                <select id="package" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    <option value="">-- اضغط لاختيار الباقة --</option>
                    <option value="باقة منزلية اقتصادية">باقة منزلية اقتصادية (Speed Basic)</option>
                    <option value="باقة منزلية فائقة">باقة منزلية فائقة (Speed Ultra)</option>
                    <option value="باقة أصحاب الأعمال">باقة أعمال / تجارية (Business Plan)</option>
                    <option value="باقة الـ Fiber Optic">باقة الألياف الضوئية (Fiber Plan)</option>
                </select>
            </div>

            <!-- طريقة التواصل المفضلة -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">طريقة التواصل المفضلة لديك *</label>
                <div class="grid grid-cols-2 gap-3 mt-1">
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50 border-slate-300">
                        <input type="radio" name="contactMethod" value="WhatsApp" checked class="text-blue-600 focus:ring-blue-500">
                        <span class="text-sm font-medium text-slate-700">💬 واتساب</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50 border-slate-300">
                        <input type="radio" name="contactMethod" value="Telegram/Phone" class="text-blue-600 focus:ring-blue-500">
                        <span class="text-sm font-medium text-slate-700">✈️ تلغرام / اتصال</span>
                    </label>
                </div>
            </div>

            <!-- الموقع الجغرافي GPS -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">الموقع الجغرافي (GPS)</label>
                <button type="button" id="getLocationBtn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 px-4 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                    📍 تحديد موقعي الحالي تلقائياً
                </button>
                <input type="hidden" id="locationUrl">
                <p id="locationStatus" class="text-xs text-green-600 mt-1 hidden">✓ تم تحديد موقعك بنجاح</p>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition">
                إرسال طلب التركيب
            </button>
        </form>

        <!-- رسالة النجاح -->
        <div id="successMessage" class="hidden text-center py-6">
            <div class="text-green-500 text-5xl mb-3">✓</div>
            <h2 class="text-xl font-bold text-slate-800 mb-1">تم تسجيل طلبك بنجاح!</h2>
            <p class="text-slate-500 text-sm mb-6">شكراً لتواصلك معنا. تم استلام تفاصيل الطلب وسيتم التواصل معك قريباً.</p>
            
            <div id="actionButtons" class="space-y-3">
                <a id="whatsappDirectBtn" href="#" target="_blank" class="hidden w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
                    💬 إرسال نسخة من الطلب عبر واتساب
                </a>
                <a id="telegramDirectBtn" href="#" target="_blank" class="hidden w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
                    ✈️ التواصل معنا عبر تلغرام
                </a>
            </div>
        </div>
    </div>

    <script>
        const MY_WHATSAPP_NUMBER = "96171585414"; 
        const MY_TELEGRAM_USERNAME = "nournetalibot"; 

        // تحديد موقع GPS
        document.getElementById('getLocationBtn').addEventListener('click', () => {
            const status = document.getElementById('locationStatus');
            if (navigator.geolocation) {
                status.innerText = "جاري جلب الموقع...";
                status.classList.remove('hidden', 'text-green-600');
                status.classList.add('text-slate-500');

                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    document.getElementById('locationUrl').value = `https://maps.google.com/?q=${lat},${lon}`;
                    status.innerText = "✓ تم تحديد الموقع بنجاح!";
                    status.classList.remove('text-slate-500');
                    status.classList.add('text-green-600');
                }, () => {
                    alert("تعذر الحصول على الموقع تلقائياً، يمكنك إرسال الطلب وسنتواصل معك لتحديد العنوان.");
                    status.classList.add('hidden');
                });
            } else {
                alert("متصفحك لا يدعم تحديد الموقع الجغرافي.");
            }
        });

        // إرسال البيانات للـ Backend
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الإرسال...";

            const contactMethod = document.querySelector('input[name="contactMethod"]:checked').value;

            const payload = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                package: document.getElementById('package').value,
                locationUrl: document.getElementById('locationUrl').value || "لم يتم التحديد",
                contactMethod: contactMethod
            };

            try {
                // تم ربطه بسيرفر Render المباشر
                const response = await fetch('https://nournet.onrender.com/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('orderForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');

                const waMessage = `🚨 *طلب تركيب إنترنت جديد*%0A%0A` +
                                  `👤 *الاسم:* ${encodeURIComponent(payload.fullName)}%0A` +
                                  `📞 *الهاتف:* ${encodeURIComponent(payload.phone)}%0A` +
                                  `📍 *العنوان:* ${encodeURIComponent(payload.address)}%0A` +
                                  `📦 *الباقة:* ${encodeURIComponent(payload.package)}%0A` +
                                  `🗺️ *الموقع:* ${encodeURIComponent(payload.locationUrl)}`;

                const waBtn = document.getElementById('whatsappDirectBtn');
                waBtn.href = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${waMessage}`;

                const tgBtn = document.getElementById('telegramDirectBtn');
                tgBtn.href = `https://t.me/${MY_TELEGRAM_USERNAME}`;

                if (contactMethod === 'WhatsApp') {
                    waBtn.classList.remove('hidden');
                    window.open(waBtn.href, '_blank');
                } else {
                    tgBtn.classList.remove('hidden');
                }

            } catch (err) {
                console.error(err);
                alert("تعذر الاتصال بالسيرفر. يرجى التأكد من تشغيل السيرفر أو المحاولة لاحقاً.");
                submitBtn.disabled = false;
                submitBtn.innerText = "إرسال طلب التركيب";
            }
        });
    </script>
</body>
</html>
