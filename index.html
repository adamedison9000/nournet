<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور نت - طلب اشتراك جديد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0070f3; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0051cc; }
    </style>
</head>
<body>

<div class="container">
    <h2>طلب اشتراك في شبكة نور نت</h2>
    
    <form action="https://formspree.io/f/maeywykr" method="POST">
        <div class="form-group">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكريم">
        </div>
        
        <div class="form-group">
            <label for="phone">رقم الهاتف (واتساب):</label>
            <input type="tel" id="phone" name="phone" required placeholder="03xxxxxx أو 70xxxxxx">
        </div>

        <div class="form-group">
            <label for="location">المنطقة / العنوان:</label>
            <input type="text" id="location" name="location" required placeholder="البقاع - اسم المنطقة بالتحديد">
        </div>

        <div class="form-group">
            <label for="package">الباقة المطلوبة:</label>
            <select id="package" name="package">
                <option value="باقة الأفراد العادية">باقة الأفراد العادية</option>
                <option value="الباقة السريعة">الباقة السريعة</option>
                <option value="الباقة المفتوحة">الباقة المفتوحة</option>
            </select>
        </div>

        <button type="submit">إرسال الطلب</button>
    </form>
</div>

</body>
</html>
