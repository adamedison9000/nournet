<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOURNET | High-Speed Internet Subscription</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            color: #fff;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        select option {
            background: #1e1b4b;
            color: #fff;
        }

        .location-wrapper {
            display: flex;
            gap: 10px;
        }

        .location-wrapper input {
            flex: 1;
        }

        .loc-btn {
            background: rgba(79, 70, 229, 0.2);
            border: 1px solid #4f46e5;
            color: #818cf8;
            padding: 0 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .loc-btn:hover {
            background: #4f46e5;
            color: #fff;
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h1>NOURNET</h1>
        <p>Select your package & connect instantly</p>
    </div>
    
    <form id="telegramForm" onsubmit="sendToTelegram(event)">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number (WhatsApp)</label>
            <input type="tel" id="phone" required placeholder="03xxxxxx or 70xxxxxx">
        </div>

        <div class="form-group">
            <label for="connectionType">Connection Type</label>
            <select id="connectionType" required>
                <option value="Fiber">Fiber Optics</option>
                <option value="Wireless">Wireless</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Location / Area</label>
            <div class="location-wrapper">
                <input type="text" id="location" required placeholder="Enter area or get GPS">
                <button type="button" class="loc-btn" onclick="getLocation()">📍 Get GPS</button>
            </div>
        </div>

        <div class="form-group">
            <label for="package">Choose Package</label>
            <select id="package">
                <optgroup label="Standard & Shared Packages">
                    <option value="Up to 4MB 300GB+FN (25 USD)">Up to 4MB 300GB + FN — 25 USD</option>
                    <option value="Up to 16MB 550GB+FN (30 USD)">Up to 16MB 550GB + FN — 30 USD</option>
                    <option value="Up to 24MB 660GB+FN (35 USD)" selected>Up to 24MB 660GB + FN — 35 USD</option>
                    <option value="Up to 32MB 770GB+FN (40 USD)">Up to 32MB 770GB + FN — 40 USD</option>
                    <option value="Up to 48MB 880GB+FN (45 USD)">Up to 48MB 880GB + FN — 45 USD</option>
                    <option value="Up to 54MB 990GB+FN (50 USD)">Up to 54MB 990GB + FN — 50 USD</option>
                    <option value="Up to 80MB 1.1TB+FN (85 USD)">Up to 80MB 1.1TB + FN — 85 USD</option>
                </optgroup>
                <optgroup label="Gaming & Dedicated Packages">
                    <option value="Gaming (65 USD)">Gaming — 65 USD</option>
                    <option value="4M-Dedicated (125 USD)">4M-Dedicated — 125 USD</option>
                    <option value="6M-Dedicated (185 USD)">6M-Dedicated — 185 USD</option>
                    <option value="8M-Dedicated (245 USD)">8M-Dedicated — 245 USD</option>
                </optgroup>
            </select>
        </div>

        <button type="submit" id="submitBtn">Submit Request</button>
        <p id="status"></p>
    </form>
</div>

<script>
function getLocation() {
    const locInput = document.getElementById('location');
    if (navigator.geolocation) {
        locInput.value = "Fetching GPS location...";
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                locInput.value = `https://maps.google.com/?q=${lat},${lon}`;
            },
            (error) => {
                locInput.value = "";
                alert("Unable to retrieve your location. Please type it manually.");
            }
        );
    } else {
        alert("Geolocation is not supported by your browser.");
    }
}

async function sendToTelegram(event) {
    event.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const connectionType = document.getElementById('connectionType').value;
    const location = document.getElementById('location').value;
    const pkg = document.getElementById('package').value;

    submitBtn.disabled = true;
    submitBtn.innerText = "Sending...";
    status.style.color = "#94a3b8";
    status.innerText = "";

    try {
        const response = await fetch('/api/send-telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                name, 
                phone, 
                location: `${location} (Type: ${connectionType})`, 
                package: pkg 
            })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            status.style.color = "#34d399";
            status.innerText = "✨ Request sent successfully! We will contact you soon.";
            document.getElementById('telegramForm').reset();
        } else {
            status.style.color = "#f87171";
            status.innerText = "❌ An error occurred, please try again later.";
        }
    } catch (error) {
        status.style.color = "#f87171";
        status.innerText = "⚠️ Connection error, please check your internet.";
    }

    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Request";
}
</script>

</body>
</html>
