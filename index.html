<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOURNET - New Subscription Request</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; direction: ltr; text-align: left; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0070f3; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #0070f3; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #0051cc; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
        .packages-info { background: #eef4ff; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; color: #004085; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>NOURNET</h2>
    <p class="subtitle">Choose your preferred package and submit your subscription request easily</p>

    <div class="packages-info">
        <b>💡 Available Internet Packages:</b>
        <ul style="margin: 5px 0 0 0; padding-left: 20px;">
            <li>All speeds and updated prices included</li>
        </ul>
    </div>
    
    <form id="telegramForm" onsubmit="sendToTelegram(event)">
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" required placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number (WhatsApp):</label>
            <input type="tel" id="phone" required placeholder="03xxxxxx or 70xxxxxx">
        </div>

        <div class="form-group">
            <label for="location">Location / Area:</label>
            <input type="text" id="location" required placeholder="Enter your exact area">
        </div>

        <div class="form-group">
            <label for="package">Select Package:</label>
            <select id="package">
                <optgroup label="Standard & Shared Packages">
                    <option value="Up to 4MB 300GB+FN (25 USD)">Up to 4MB 300GB + FN — 25 USD</option>
                    <option value="Up to 16MB 550GB+FN (30 USD)">Up to 16MB 550GB + FN — 30 USD</option>
                    <option value="Up to 24MB 660GB+FN (35 USD)" selected>Up to 24MB 660GB + FN — 35 USD</option>
                    <option value="Up to 32MB 770GB+FN (40 USD)">Up to 32MB 770GB + FN — 40 USD</option>
                    <option value="Up to 48MB 880GB+FN (45 USD)">Up to 48MB 880GB + FN — 45 USD</option>
                    <option value="Up to 54MB 990GB+FN (50 USD)">Up to 54MB 990GB + FN — 50 USD</option>
                    <option value="Up to 80MB 1.1TB+FN (85 USD)">Up to 80MB 1.1TB + FN — 85 USD</option>
                </optgroup>
                <optgroup label="Gaming & Dedicated Packages">
                    <option value="Gaming (65 USD)">Gaming — 65 USD</option>
                    <option value="4M-Dedicated (125 USD)">4M-Dedicated — 125 USD</option>
                    <option value="6M-Dedicated (185 USD)">6M-Dedicated — 185 USD</option>
                    <option value="8M-Dedicated (245 USD)">8M-Dedicated — 245 USD</option>
                </optgroup>
            </select>
        </div>

        <button type="submit" id="submitBtn">Submit Request</button>
        <p id="status"></p>
    </form>
</div>

<script>
async function sendToTelegram(event) {
    event.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const location = document.getElementById('location').value;
    const pkg = document.getElementById('package').value;

    submitBtn.disabled = true;
    submitBtn.innerText = "Sending...";
    status.style.color = "#555";
    status.innerText = "";

    try {
        const response = await fetch('/api/send-telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, location, package: pkg })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            status.style.color = "green";
            status.innerText = "Request sent successfully! We will contact you soon.";
            document.getElementById('telegramForm').reset();
        } else {
            status.style.color = "red";
            status.innerText = "An error occurred, please try again later.";
        }
    } catch (error) {
        status.style.color = "red";
        status.innerText = "Connection error, please check your internet.";
    }

    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Request";
}
</script>

</body>
</html>
