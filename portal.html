<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOURNET | تفاصيل الاشتراك - Account Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #4f46e5;
            color: #fff;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 20px;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .portal-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .portal-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-netpro {
            background: rgba(6, 182, 212, 0.15);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.3);
        }

        .btn-netpro:hover {
            background: rgba(6, 182, 212, 0.35);
            transform: translateY(-2px);
        }

        .btn-terra {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.3);
        }

        .btn-terra:hover {
            background: rgba(168, 85, 247, 0.35);
            transform: translateY(-2px);
        }

        .btn-tag {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>
    <span style="font-weight: 800; color: #818cf8;">NOURNET</span>
</div>

<div class="card">
    <h1>👤 بوابة إدارة الاشتراك والحساب</h1>
    <p>اختر بوابة المزود التابع له اشتراكك للوصول لتفاصيل الحساب وتعبئة الرصيد:</p>
    
    <div class="portal-options">
        <a href="https://user.netprolb.com/user.php" target="_blank" rel="noopener noreferrer" class="portal-btn btn-netpro">
            <span>🌐 اشتراكات NetPro</span>
            <span class="btn-tag">دخول ↗</span>
        </a>

        <a href="https://acppro.terra.net.lb/login" target="_blank" rel="noopener noreferrer" class="portal-btn btn-terra">
            <span>🌐 اشتراكات TerraNet</span>
            <span class="btn-tag">دخول ↗</span>
        </a>
    </div>
</div>

</body>
</html>
