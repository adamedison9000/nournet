<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOURNET | خريطة التغطية - Fiber Coverage Map</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #4f46e5;
            color: #fff;
        }

        .card {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 20px;
            color: #fbbf24;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .map-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .map-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .map-container img:hover {
            cursor: pointer;
        }

        .full-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .full-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>
    <span style="font-weight: 800; color: #818cf8;">NOURNET</span>
</div>

<div class="card">
    <h1>🗺️ مناطق تغطية شبكة الألياف الضوئية (Fiber Optics)</h1>
    <p>انقر على الصورة لفتحها بحجم كامل والتكبير لمعاينة خطوط التغطية بالتفصيل.</p>
    
    <div class="map-container">
        <!-- الصورة تستدعي ملف coverage.jpg الذي ترفعه على GitHub -->
        <a href="coverage.jpg" target="_blank">
            <img src="coverage.jpg" alt="NOURNET Fiber Coverage Map" id="coverageImage" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x500/1e1b4b/818cf8?text=Image+Coverage.jpg+Not+Found';">
        </a>
    </div>

    <a href="coverage.jpg" target="_blank" class="full-btn">
        🔍 فتح الصورة بالحجم الكامل للتكبير
    </a>
</div>

</body>
</html>
